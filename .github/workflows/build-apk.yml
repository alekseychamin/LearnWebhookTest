name: Build diagnostic APK

on:
  push:
    branches: [ agent/folduirescue-yoloprice ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project sources
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/source.b64.part* | base64 --decode > /tmp/foldui-source.tar.gz
          echo "206bec8ff4045710838b8f9f65b220b79fe67d4d3caa560e1db7b9b6fe7a2222  /tmp/foldui-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/foldui-source.tar.gz -C .
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          cp "$APK" FoldUiRescue-YoloPrice-Diagnostic-0.1.apk
          sha256sum FoldUiRescue-YoloPrice-Diagnostic-0.1.apk | tee FoldUiRescue-YoloPrice-Diagnostic-0.1.sha256

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldUiRescue-YoloPrice-Diagnostic-0.1
          path: |
            FoldUiRescue-YoloPrice-Diagnostic-0.1.apk
            FoldUiRescue-YoloPrice-Diagnostic-0.1.sha256
            permissions.txt
            signature.txt
          if-no-files-found: error
          retention-days: 7
